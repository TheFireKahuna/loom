[package]
name = "loom"
# When releasing to crates.io:
# - Update version number
#   - README.md
#   - src/lib.rs
# - Update CHANGELOG.md
# - Create git tag
version = "0.7.2"
edition = "2021"
license = "MIT"
authors = ["Carl Lerche <me@carllerche.com>"]
description = "Permutation testing for concurrent code"
homepage = "https://github.com/tokio-rs/loom"
repository = "https://github.com/tokio-rs/loom"
readme = "README.md"
keywords = ["atomic", "lock-free"]
categories = ["concurrency", "data-structures"]
rust-version = "1.73"

[features]
default = []
checkpoint = ["serde", "serde_json"]
futures = []
# Zero-validity proofs for `sync::atomic::materialized`. A consumer that
# reinterprets zeroed memory as records proves it with `zerocopy::FromZeros`,
# and the derive on such a record requires every field to carry the impl. The
# orphan rule puts that out of the consumer's reach for a loom type, so it is
# supplied here.
zerocopy = ["dep:zerocopy"]

[dependencies]
cfg-if = "1.0.0"
scoped-tls = "1.0.0"

# Small-vector optimization for the atomic model's per-op scratch buffers
# (region cover sets, wide-op resolution lists) — these are almost always
# 1-4 elements and were heap-allocating on every modeled atomic access.
smallvec = "1.11"

# Faster (non-DoS-resistant) hashing for the internal pointer-keyed maps of
# raw allocations and Arc objects. Keys are process addresses / small ints;
# the default SipHash is pure overhead here.
rustc-hash = "2"

# Provides a generator based runtime
generator = "0.8.1"

# Requires for "checkpoint" feature
serde = { version = "1.0.113", features = ["derive"], optional = true }
serde_json = { version = "1.0.33", optional = true }

# Requires for "zerocopy" feature
zerocopy = { version = "0.8", default-features = false, features = [
    "derive",
], optional = true }

tracing = { version = "0.1.27", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.8", features = ["env-filter"] }

[dev-dependencies]
# Exercises the `zerocopy` feature: a record built from materialized cells must
# be able to derive `FromZeros`, which is how a consumer proves reinterpreting
# zeroed memory as that record is sound.
zerocopy = { version = "0.8", features = ["derive"] }
futures-util = "0.3.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
